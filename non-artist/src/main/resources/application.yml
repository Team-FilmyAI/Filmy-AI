
spring:
  application:
    name: non-artist

  datasource:
    url: jdbc:postgresql://localhost:5432/NonArtist
    username: postgres
    password: user
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

